name: Terraform CI

on:
  workflow_dispatch:

jobs:

  # =========================================================
  # TERRAFORM PLAN
  # =========================================================
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform Formatting
        run: terraform fmt -check

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -var-file="terraform.tfvars" -out=tfplan

      - name: Convert Plan to JSON
        run: terraform show -json tfplan > tfplan.json

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            tfplan
            tfplan.json


  # =========================================================
  # AWS COST ESTIMATION
  # =========================================================
  cost-estimate:
    name: AWS Cost Estimate
    needs: plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan

      - name: Show Terraform Resources
        run: |
          echo "Resources in Terraform plan:"
          jq -r '
            .resource_changes[]
            | select(.change.actions | index("create"))
            | "\(.type) - \(.name)"
          ' tfplan.json

      - name: AWS Pricing Calculator
        run: |
          echo "AWS Pricing Calculator cost estimation stage"
          echo "Terraform resources:"
          jq -r '
            .resource_changes[]
            | select(.change.actions | index("create"))
            | "\(.type) - \(.name)"
          ' tfplan.json

          echo ""
          echo "AWS-native Pricing Calculator API can be integrated here."
          echo "The Terraform plan itself is NOT directly accepted by the Pricing Calculator API."


  # =========================================================
  # SECURITY SCAN
  # =========================================================
  security-scan:
    name: Terraform Security Scan
    needs: plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        continue-on-error: true
        with:
          directory: .
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,results.sarif

      - name: Security Scan Summary
        if: always()
        run: |
          echo "# 🔐 Terraform Security Scan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Checkov completed. Security findings are informational and do not block deployment." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "👉 Open the **Terraform Security Scan** job above to review the complete Checkov findings." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-report
          path: results.sarif
          if-no-files-found: warn

  # =========================================================
  # APPLY
  # =========================================================
  apply:
    name: Terraform Apply
    needs:
      - plan
      - cost-estimate
      - security-scan

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Terraform Init
        run: terraform init

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan

      - name: Verify Download Files
        run: ls -lah

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
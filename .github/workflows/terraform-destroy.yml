name: Terraform CI

on:
  workflow_dispatch:

jobs:

  # =========================================================
  # TERRAFORM PLAN
  # =========================================================
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform Formatting
        run: terraform fmt -check

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -var-file="terraform.tfvars" -out=tfplan

      - name: Convert Plan to JSON
        run: terraform show -json tfplan > tfplan.json

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            tfplan
            tfplan.json


  # =========================================================
  # SECURITY SCAN
  # =========================================================
  security-scan:
    name: Security Scan
    needs: plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          soft_fail: true
          output_format: cli,sarif
          output_file_path: console,results.sarif

      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-report
          path: results.sarif


  # =========================================================
  # COST ESTIMATE
  # =========================================================
  cost-estimate:
    name: Cost Estimate
    needs: plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan

      - name: Generate Cost Report
        run: |
          echo "======================================"
          echo "       TERRAFORM COST REPORT"
          echo "======================================"
          echo ""
          echo "Resources planned for deployment:"
          echo ""

          jq -r '
            .resource_changes[]
            | select(.change.actions | index("create"))
            | "\(.type) - \(.name)"
          ' tfplan.json

          echo ""
          echo "======================================"
          echo "AWS Pricing Calculator should be used"
          echo "for the actual estimated monthly cost."
          echo "======================================"

          cat > cost-report.txt <<EOF
          Terraform Cost Estimation Report
          =================================

          Planned resources:

          $(jq -r '
            .resource_changes[]
            | select(.change.actions | index("create"))
            | "\(.type) - \(.name)"
          ' tfplan.json)

          =================================
          Review these resources in AWS Pricing Calculator
          before approving the deployment.
          EOF

      - name: Upload Cost Report
        uses: actions/upload-artifact@v4
        with:
          name: cost-estimate-report
          path: cost-report.txt


  # =========================================================
  # APPLY
  # =========================================================
  apply:
    name: Terraform Apply
    needs:
      - plan
      - security-scan
      - cost-estimate

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Terraform Init
        run: terraform init

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan

      - name: Verify Files
        run: ls -lah

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan